version: 2
updates:
  # Weekly, grouped: one Monday run opens at most a few pull requests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 4
    ignore:
      # Matches the Node 22 runtime in .node-version.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Zurich
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
