name: CI

# PR gate: format, lint, types, unit tests, the package build and every story as a browser
# test. Actions minutes are free for public repositories, so the browser tests run here too.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, types, unit tests and build
        run: npm run check

      - name: Install Chromium for the story tests
        run: npx playwright install --with-deps chromium

      - name: Run every story as a browser test
        run: npm run test:storybook
