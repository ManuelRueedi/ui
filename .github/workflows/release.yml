name: Release

# On a version tag (v0.2.0), build the package and attach it to a GitHub release.
# Apps install that file, so an install needs no build, no Git and no token.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Format, lint, types, unit tests and build
        run: npm run check

      - name: Pack
        run: npm pack

      - name: Create the release with the package file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" manuelrueedi-ui-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
